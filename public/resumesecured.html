<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resume - Subbaramaiah Chevuru</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Redirect to login if not authenticated -->
  <script>
    if (localStorage.getItem('isAuthenticated') !== 'true') {
      window.location.href = 'login.html';
    }
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #87cefa;
      text-align: center;
    }

    .resume-header {
      text-align: center;
      padding: 10px 0;
      max-width: 1000px;
      margin: 0 auto;
    }

    .resume-header h1 {
      font-size: 2.2em;
      font-weight: bold;
      text-transform: uppercase;
      background: url('images/banner.webp') no-repeat center center;
      background-size: cover;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
      border-bottom: 2px solid #0073e6;
      padding-bottom: 5px;
      margin: 5px 0;
    }

    #resume-viewer {
      background-color: #fff;
      margin: 10px auto;
      padding: 20px;
      max-width: 1000px;
      border-radius: 8px;
      box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
      text-align: left;
    }

    h2 {
      font-size: 1.8em;
      border-bottom: 2px solid #0073e6;
      padding-bottom: 10px;
      color: #0073e6;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
    }

    .logout-btn {
      background-color: #e60000;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 5px;
      margin-top: 20px;
      cursor: pointer;
    }

    .logout-btn:hover {
      background-color: #cc0000;
    }

    footer {
      margin-top: 10px;
      padding: 15px;
      background-color: #0073e6;
      color: #fff;
    }

    footer a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <!-- Resume Header -->
  <div class="resume-header">
    <h1>Resume</h1>
  </div>

  <!-- Resume Viewer -->
  <section id="resume-viewer">
    <h2>View My Resume</h2>
    <p>You can view or download the resume using the link below.</p>

    <iframe src="https://docs.google.com/document/d/1Nn5CZOMlNmn2newMkfOxv6o9VErZ8bUP/preview"
            title="Subbaramaiah Chevuru Resume">
    </iframe>

    <!-- Logout Button -->
    <button class="logout-btn" onclick="logout()">Logout</button>
  </section>

  <!-- Footer -->
  <footer>
    <p><a href="index.html">Back to Profile</a></p>
  </footer>

  <script>
    function logout() {
      localStorage.removeItem('isAuthenticated');
      window.location.href = 'login.html';
    }
  </script>
</body>
</html>
