name: Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # 5️⃣ Pull the Docker image
      - name: Pull Docker image
        run: |
          docker pull ramsubbaram/my-node-app

      # 6️⃣ Run the Docker container
      - name: Run Docker container
        run: |
          docker run -d -p 3000:3000 ramsubbaram/my-node-app

      # 7️⃣ Test if app is responding
      - name: Test app
        run: |
          sleep 5
          curl -f http://localhost:3000
