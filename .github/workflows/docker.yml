name: Docker Build, Push & Run with Ngrok, Logs & Cleanup

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # 5️⃣ Pull and run Docker container
      - name: Run Docker container
        run: |
          docker pull ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest
          docker run -d --name my-node-app -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # 6️⃣ Install ngrok
      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok -y

      # 7️⃣ Start ngrok tunnel
      - name: Start ngrok tunnel
        run: |
          ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ngrok http 3000 --log=stdout &
          sleep 5
          echo "Public ngrok URL:"
          curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'

      # 8️⃣ Show live logs from the container
      - name: Show Node app logs
        run: |
          docker logs -f my-node-app &
          sleep 8640000  # give it some time for testing  as 100 days

      # 9️⃣ Cleanup container
      - name: Stop and remove container
        run: |
          docker stop my-node-app
          docker rm my-node-app

