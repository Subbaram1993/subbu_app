name: Docker Build, Push & Run with Ngrok (3 Hours)

on:
  push:
    branches:
      - main

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 180   # ⏱️ 3 hours max

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3️⃣ Build Docker image
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest .

      # 4️⃣ Push Docker image
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # 5️⃣ Run Docker container
      - name: Run Docker container
        run: |
          docker run -d --name my-node-app -p 3000:3000 \
            ${{ secrets.DOCKER_USERNAME }}/my-node-app:latest

      # 6️⃣ Install ngrok
      - name: Install ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update
          sudo apt install ngrok -y
          sudo apt install jq -y

      # 7️⃣ Start ngrok tunnel
      - name: Start ngrok tunnel
        run: |
          ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}
          ngrok http 3000 --log=stdout &
          sleep 5
          echo "Public ngrok URL:"
          curl -s http://127.0.0.1:4040/api/tunnels | jq -r '.tunnels[0].public_url'

      # 8️⃣ Show logs and keep alive for 3 hours
      - name: Run for 3 hours
        run: |
          docker logs -f my-node-app &
          echo "⏳ Running for 3 hours..."
          sleep 10800   # 3 hours

      # 9️⃣ Cleanup (always runs)
      - name: Cleanup container
        if: always()
        run: |
          docker stop my-node-app || true
          docker rm my-node-app || true
