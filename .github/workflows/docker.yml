name: Docker Build & Trigger Jenkins

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  JENKINS_JOB_NAME: subbu_app
  JSON_PATH: .github/pages/ngrok_pages.json

jobs:
  trigger-and-version:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1️⃣ Trigger Jenkins Job with CSRF crumb
      - name: Trigger Jenkins Job
        id: trigger_jenkins
        run: |
          set -euo pipefail

          echo "🔐 Fetching Jenkins crumb..."
          CRUMB=$(curl -s \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | jq -r '.crumb')

          if [ -z "$CRUMB" ] || [ "$CRUMB" = "null" ]; then
            echo "❌ Failed to fetch Jenkins crumb"
            exit 1
          fi

          echo "✅ Jenkins crumb acquired"

          echo "🚀 Triggering Jenkins job..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            -H "Jenkins-Crumb: $CRUMB" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/buildWithParameters")

          if [ "$STATUS" != "201" ]; then
            echo "❌ Jenkins trigger failed (HTTP $STATUS)"
            exit 1
          fi

          echo "✅ Jenkins triggered successfully"

      # 2️⃣ Get Jenkins build number (after trigger success)
      - name: Get Jenkins Build Number
        run: |
          set -euo pipefail

          BUILD_NUMBER=$(curl -s \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/buildNumber")

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid Jenkins build number"
            exit 1
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "🔢 Jenkins build number: $BUILD_NUMBER"

      # 3️⃣ Determine version using your logic
      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(((BUILD_NUMBER / 10) % 6))
          MAJOR=$((BUILD_NUMBER / 60))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Determined version: $VERSION"

      # 4️⃣ Update JSON (preserve ngrok URL)
      - name: Update version in JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages

          if [ -f "${JSON_PATH}" ]; then
            EXISTING_URL=$(jq -r '.ngrok_url // ""' "${JSON_PATH}")
          else
            EXISTING_URL=""
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$EXISTING_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated}' \
            > "${JSON_PATH}"

          echo "📝 JSON updated (version updated, ngrok URL preserved)"

      # 5️⃣ Commit JSON
      - name: Commit JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Update version to ${VERSION} [skip ci]"
            git push
            echo "✅ JSON committed"
          fi
