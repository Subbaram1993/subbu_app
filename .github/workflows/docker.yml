name: Docker Build & Trigger Jenkins (Persistent Runtime)

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  IMAGE_NAME: my-node-app
  PAGES_JSON_PATH: .github/pages/ngrok_pages.json
  JENKINS_JOB_NAME: subbu_app

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get Jenkins Build Number
        run: |
          set -euo pipefail

          BUILD_NUMBER=$(curl -s \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/buildNumber" || true)

          [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]] || BUILD_NUMBER=0
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(((BUILD_NUMBER / 10) % 6))
          MAJOR=$((BUILD_NUMBER / 60))
          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          set -euo pipefail
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      - name: Push Docker Images
        run: |
          set -euo pipefail
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Trigger Jenkins Job
        run: |
          set -euo pipefail

          curl -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build"

          echo "✅ Jenkins job triggered"

      - name: Wait & Fetch ngrok URL from Jenkins
        run: |
          set -euo pipefail
          echo "⏳ Waiting for ngrok tunnel..."

          for i in {1..15}; do
            NGROK_URL=$(curl -s --max-time 5 \
              -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/ngrok-url" | jq -r '.url' || true)

            if [[ -n "$NGROK_URL" && "$NGROK_URL" != "null" ]]; then
              echo "NGROK_URL=$NGROK_URL" >> "$GITHUB_ENV"
              echo "✅ ngrok URL acquired: $NGROK_URL"
              exit 0
            fi

            echo "⏱ Retry $i/15..."
            sleep 10
          done

          echo "❌ ngrok URL not available after waiting"
          exit 1

      - name: Save ngrok JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages
          jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$NGROK_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated}' \
            > "${PAGES_JSON_PATH}"

      - name: Commit ngrok JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${PAGES_JSON_PATH}"
          git diff --cached --quiet || git commit -m "Update ngrok URL (${VERSION}) [skip ci]"
          git push

      - name: Finish
        run: |
          echo "🚀 Deployment completed"
          echo "Version: $VERSION"
          echo "ngrok URL: $NGROK_URL"
