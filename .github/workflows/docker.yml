name: Docker Build & Trigger Jenkins (Persistent Runtime)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-node-app
  PAGES_JSON_PATH: .github/pages/ngrok_pages.json
  JENKINS_JOB_NAME: subbu_app

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Get Jenkins Build Number (Robust)
      - name: Get Jenkins Build Number
        run: |
          set -e

          echo "🔍 Fetching Jenkins build number..."

          API_URL="${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/api/json"

          RESPONSE=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" "$API_URL")

          # Attempt to get lastSuccessfulBuild number first
          BUILD_NUMBER=$(echo "$RESPONSE" | jq -r '.lastSuccessfulBuild.number // empty')

          # Fallback to lastBuild if lastSuccessfulBuild not available
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "⚠️ lastSuccessfulBuild not available, trying lastBuild..."
            BUILD_NUMBER=$(echo "$RESPONSE" | jq -r '.lastBuild.number // empty')
          fi

          # If still invalid, fallback to 0 (job never ran)
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "⚠️ Jenkins job has no builds yet, setting BUILD_NUMBER=0"
            BUILD_NUMBER=0
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "✅ Jenkins Build Number: $BUILD_NUMBER"

      # 3️⃣ Determine Version from Build Number
      - name: Determine Version
        run: |
          set -e

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(( (BUILD_NUMBER / 10) % 6 ))
          MAJOR=$(( BUILD_NUMBER / 60 ))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Determined Version: $VERSION"

      # 4️⃣ Save Version to JSON
      - name: Save Version to ngrok_pages.json
        run: |
          set -e
          mkdir -p .github/pages

          jq -n \
            --arg version "$VERSION" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, last_updated: $last_updated}' \
            > "${PAGES_JSON_PATH}"

          echo "📝 ngrok_pages.json updated"

      # 5️⃣ Commit Version (only if changed, skip CI)
      - name: Commit Version
        run: |
          set -e

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add "${PAGES_JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Version updated to ${VERSION} [skip ci]"
            git push
            echo "✅ Version committed"
          fi

      # 6️⃣ Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 8️⃣ Push Docker Images
      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 9️⃣ Trigger Jenkins Job
      - name: Trigger Jenkins Job
        run: |
          curl -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build"

      # 🔟 Finish
      - name: Finish
        run: |
          echo "✅ Final Version: $VERSION"
          echo "🚀 Jenkins job 'subbu_app' triggered"
