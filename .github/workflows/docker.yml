name: Docker Build & Trigger Jenkins (Persistent Runtime)

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-node-app
  PAGES_JSON_PATH: .github/pages/ngrok_pages.json
  JENKINS_JOB_NAME: subbu_app

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Get Jenkins Build Number
      - name: Get Latest Jenkins Build Number
        run: |
          set -e

          BUILD_NUMBER=$(curl -s \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/lastSuccessfulBuild/api/json" \
            | jq -r '.number')

          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "❌ Invalid Jenkins build number"
            exit 1
          fi

          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV
          echo "✅ Jenkins Build Number: $BUILD_NUMBER"

      # 3️⃣ Determine Version
      - name: Determine Version
        run: |
          set -e

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(( (BUILD_NUMBER / 10) % 6 ))
          MAJOR=$(( BUILD_NUMBER / 60 ))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Version: $VERSION"

      # 4️⃣ Save version to JSON
      - name: Save Version to ngrok_pages.json
        run: |
          set -e
          mkdir -p .github/pages

          jq -n \
            --arg version "$VERSION" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, last_updated: $last_updated}' \
            > "${PAGES_JSON_PATH}"

      # 5️⃣ Commit version (skip CI)
      - name: Commit Version
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          git add "${PAGES_JSON_PATH}"
          git commit -m "Version updated to ${VERSION} [skip ci]"
          git push

      # 6️⃣ Docker Login
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7️⃣ Build Docker Image
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 8️⃣ Push Docker Images
      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 9️⃣ Trigger Jenkins
      - name: Trigger Jenkins Job
        run: |
          curl -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build"

      # 🔟 Finish
      - name: Finish
        run: |
          echo "✅ Version: $VERSION"
          echo "🚀 Jenkins triggered"
