name: Docker Build & Trigger Jenkins

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  JENKINS_JOB_NAME: subbu_app
  JSON_PATH: .github/pages/ngrok_pages.json
  POLL_INTERVAL: 10
  MAX_WAIT_TIME: 300   # 5 minutes

jobs:
  update-json-version:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Trigger Jenkins Job
      - name: Trigger Jenkins Job
        run: |
          set -euo pipefail

          echo "🚀 Triggering Jenkins job..."

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build")

          if [ "$STATUS" != "201" ]; then
            echo "❌ Jenkins trigger failed (HTTP $STATUS)"
            exit 1
          fi

          echo "✅ Jenkins triggered successfully"

      # 3️⃣ Poll Jenkins Until Build Completes
      - name: Wait for Jenkins Build Completion
        run: |
          set -euo pipefail

          echo "⏳ Waiting for Jenkins build to complete..."

          ELAPSED=0

          while true; do
            RESPONSE=$(curl -s \
              -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/api/json")

            BUILDING=$(echo "$RESPONSE" | jq -r '.building')
            BUILD_NUMBER=$(echo "$RESPONSE" | jq -r '.number')
            BUILD_STATUS=$(echo "$RESPONSE" | jq -r '.result')

            echo "🔄 Build #$BUILD_NUMBER | building=$BUILDING | result=$BUILD_STATUS"

            if [ "$BUILDING" = "false" ]; then
              break
            fi

            if [ "$ELAPSED" -ge "$MAX_WAIT_TIME" ]; then
              echo "❌ Timeout waiting for Jenkins build"
              exit 1
            fi

            sleep "$POLL_INTERVAL"
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

          echo "LATEST_BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_STATUS=$BUILD_STATUS" >> "$GITHUB_ENV"

          if [ "$BUILD_STATUS" != "SUCCESS" ]; then
            echo "❌ Jenkins build failed"
            exit 1
          fi

          echo "✅ Jenkins build completed successfully"

      # 4️⃣ Determine Version
      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((LATEST_BUILD_NUMBER % 10))
          MINOR=$(((LATEST_BUILD_NUMBER / 10) % 6))
          MAJOR=$((LATEST_BUILD_NUMBER / 60))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Determined version: $VERSION"

      # 5️⃣ Append Version to JSON
      - name: Append version to JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages

          if [ -f "${JSON_PATH}" ]; then
            EXISTING_JSON=$(cat "${JSON_PATH}")

            IS_ARRAY=$(echo "$EXISTING_JSON" | jq 'if type=="array" then true else false end')
            if [ "$IS_ARRAY" != "true" ]; then
              EXISTING_JSON="[$EXISTING_JSON]"
            fi
          else
            EXISTING_JSON="[]"
          fi

          EXISTING_URL=$(echo "$EXISTING_JSON" | jq -r '.[-1].ngrok_url // ""')

          NEW_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$EXISTING_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg status "$BUILD_STATUS" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated, status: $status}')

          echo "$EXISTING_JSON" | jq ". + [${NEW_ENTRY}]" > "${JSON_PATH}"

          echo "📝 JSON updated"

      # 6️⃣ Commit JSON
      - name: Commit JSON
        run: |
          set -euo pipefail

          git config user.name "${{ github.actor }}"
          git config user.email "${{ secrets.GIT_EMAIL }}"

          git fetch origin main
          git reset --hard origin/main

          git add "${JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Append version ${VERSION} to JSON [skip ci]"
            git push origin main
            echo "✅ JSON committed"
          fi
