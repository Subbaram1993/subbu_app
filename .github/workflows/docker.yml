name: Docker Build & Trigger Jenkins

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  JENKINS_JOB_NAME: subbu_app
  JSON_PATH: .github/pages/ngrok_pages.json
  WAIT_SECONDS: 120  # Waiting time for Jenkins build completion

jobs:
  update-json-version:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Trigger Jenkins Job
      - name: Trigger Jenkins Job
        id: trigger_jenkins
        run: |
          set -euo pipefail

          echo "🚀 Triggering Jenkins job..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --user subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
            "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/build")

          if [ "$STATUS" != "201" ]; then
            echo "❌ Jenkins trigger failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Jenkins triggered successfully"

      # 3️⃣ Wait for Jenkins build to complete (sleep)
      - name: Re-fetch Latest Jenkins Build Number & Status
        id: refetch-jenkins-build-number-status
        run: |
          set -euo pipefail

          echo "⏳ Sleeping $WAIT_SECONDS seconds to wait for Jenkins build completion..."
          sleep $WAIT_SECONDS

          # Fetch the latest build number
          LATEST_BUILD_NUMBER=$(curl -s -u subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
            "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/api/json?tree=number" \
            | jq -r '.number')

          # Fetch the build status
          BUILD_STATUS=$(curl -s -u subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
            "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/$LATEST_BUILD_NUMBER/api/json?tree=result" \
            | jq -r '.result')

          echo "LATEST_BUILD_NUMBER=${LATEST_BUILD_NUMBER}" >> $GITHUB_ENV
          echo "BUILD_STATUS=${BUILD_STATUS}" >> $GITHUB_ENV
          echo "Build completed with status: $BUILD_STATUS"

      # 4️⃣ Determine version for JSON only
      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((LATEST_BUILD_NUMBER % 10))
          MINOR=$(((LATEST_BUILD_NUMBER / 10) % 6))
          MAJOR=$((LATEST_BUILD_NUMBER / 60))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Determined version: $VERSION"

      # 5️⃣ Append version to JSON (preserve ngrok_url)
      - name: Append version to JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages

          # Read existing JSON
          if [ -f "${JSON_PATH}" ]; then
            EXISTING_JSON=$(cat "${JSON_PATH}")

            # Convert object to array if needed
            IS_ARRAY=$(echo "$EXISTING_JSON" | jq 'if type=="array" then true else false end')
            if [ "$IS_ARRAY" != "true" ]; then
              EXISTING_JSON="[$EXISTING_JSON]"
            fi
          else
            EXISTING_JSON="[]"
          fi

          # Preserve ngrok_url from the latest entry if exists
          EXISTING_URL=$(echo "$EXISTING_JSON" | jq -r '.[-1].ngrok_url // ""')

          # Create new entry
          NEW_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$EXISTING_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            --arg status "$BUILD_STATUS" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated, status: $status}')

          # Append new entry to existing array
          echo "$EXISTING_JSON" | jq ". + [${NEW_ENTRY}]" > "${JSON_PATH}"

          echo "📝 JSON updated (new version appended)"

      # 6️⃣ Commit JSON back to GitHub
      - name: Commit JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Append version ${VERSION} to JSON [skip ci]"
            git push
            echo "✅ JSON committed"
          fi
