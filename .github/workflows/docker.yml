name: Docker Build & Trigger Jenkins

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  JENKINS_JOB_NAME: subbu_app
  JSON_PATH: .github/pages/ngrok_pages.json

jobs:
  trigger-and-version:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Trigger Jenkins Job
      - name: Trigger Jenkins Job
        id: trigger_jenkins
        run: |
          set -euo pipefail

          echo "🔐 Fetching Jenkins crumb..."
          CRUMB=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/crumbIssuer/api/json" | jq -r '.crumb // empty')

          if [ -z "$CRUMB" ]; then
            echo "⚠️ Crumb not found (CSRF may be disabled), continuing without it"
            CRUMB_HEADER=""
          else
            echo "✅ Jenkins crumb acquired"
            CRUMB_HEADER="-H Jenkins-Crumb:$CRUMB"
          fi

          echo "🚀 Triggering Jenkins job..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            $CRUMB_HEADER \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build")

          if [ "$STATUS" != "201" ]; then
            echo "❌ Jenkins trigger failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Jenkins triggered successfully"

      # 3️⃣ Wait for Jenkins build completion and get build number
      - name: Wait for Jenkins Build Completion
        run: |
          set -euo pipefail

          echo "⏳ Waiting for Jenkins build to start..."
          while true; do
            BUILD_NUMBER=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/api/json" \
              | jq -r '.number')
            if [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              break
            fi
            echo "Waiting for build number..."
            sleep 2
          done
          echo "🔢 Jenkins build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          echo "⏳ Waiting for build $BUILD_NUMBER to finish..."
          while true; do
            STATUS=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
              "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/$BUILD_NUMBER/api/json" \
              | jq -r '.result')
            if [ "$STATUS" != "null" ]; then
              echo "✅ Build finished with status: $STATUS"
              if [ "$STATUS" != "SUCCESS" ]; then
                echo "❌ Jenkins build failed"
                exit 1
              fi
              break
            fi
            echo "Build is still running..."
            sleep 5
          done

      # 4️⃣ Determine version
      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(((BUILD_NUMBER / 10) % 6))
          MAJOR=$((BUILD_NUMBER / 60))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Determined version: $VERSION"

      # 5️⃣ Update JSON (preserve existing ngrok URL)
      - name: Update version in JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages

          if [ -f "${JSON_PATH}" ]; then
            EXISTING_URL=$(jq -r '.ngrok_url // ""' "${JSON_PATH}")
          else
            EXISTING_URL=""
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$EXISTING_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated}' \
            > "${JSON_PATH}"

          echo "📝 JSON updated (version updated, ngrok URL preserved)"

      # 6️⃣ Commit JSON back to GitHub
      - name: Commit JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Update version to ${VERSION} [skip ci]"
            git push
            echo "✅ JSON committed"
          fi
