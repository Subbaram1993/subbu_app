name: Docker Build & Trigger Jenkins

on:
  push:
    branches:
      - main

env:
  IMAGE_NAME: my-node-app
  PAGES_JSON_PATH: .github/pages/ngrok_pages.json
  JENKINS_JOB_NAME: my-node-app-docker-ngrok

jobs:
  build-and-trigger:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Ensure .github/pages exists & read or create ngrok_pages.json
      - name: Create or Read ngrok_pages.json
        run: |
          mkdir -p .github/pages

          if [ ! -f "${PAGES_JSON_PATH}" ]; then
            echo "📄 ngrok_pages.json not found. Creating default..."
           cat <<EOF > ${PAGES_JSON_PATH}
           {
           "version": "v0.1.0",
           "last_updated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
           }
           EOF
          fi

          VERSION=$(jq -r '.version' ${PAGES_JSON_PATH})

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "❌ Version missing in ngrok_pages.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "📦 Using version: $VERSION"

      # 3️⃣ Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4️⃣ Build Docker image (versioned)
      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }} \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .

      # 5️⃣ Push Docker images
      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      # 6️⃣ Update ngrok_pages.json commit with [skip ci] to avoid infinite triggers
      - name: Commit ngrok_pages.json (skip CI)
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          git add ${PAGES_JSON_PATH}

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Update ngrok_pages.json [skip ci]"
            git push
            echo "✅ ngrok_pages.json committed and pushed"
          fi

      # 7️⃣ Trigger Jenkins job
      - name: Trigger Jenkins Job
        run: |
          curl -X POST \
            -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            "${{ secrets.JENKINS_URL }}/job/${{ env.JENKINS_JOB_NAME }}/build"

      # 8️⃣ Finish
      - name: Finish
        run: |
          echo "✅ Docker image pushed"
          echo "🚀 Jenkins job triggered"
          echo "🧠 GitHub Actions finished"
