name: Docker Build & Trigger Jenkins

permissions:
  contents: write

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".github/pages/ngrok_pages.json"

env:
  JENKINS_JOB_NAME: subbu_app
  JSON_PATH: .github/pages/ngrok_pages.json
  MAX_WAIT_SECONDS: 120  # 2 minutes

jobs:
  trigger-and-version:
    runs-on: self-hosted

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Trigger Jenkins Job
      - name: Trigger Jenkins Job
        id: trigger_jenkins
        run: |
          set -euo pipefail

          echo "🚀 Triggering Jenkins job..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            --user subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
            "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/build")

          if [ "$STATUS" != "201" ]; then
            echo "❌ Jenkins trigger failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Jenkins triggered successfully"

      # 3️⃣ Wait for Jenkins build completion with timeout
      - name: Wait for Jenkins Build Completion
        run: |
          set -euo pipefail

          SECONDS=0
          echo "⏳ Waiting for Jenkins build to start..."
          while true; do
            BUILD_NUMBER=$(curl -s -u subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
              "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/lastBuild/api/json" \
              | jq -r '.number')
            if [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
              break
            fi
            if [ "$SECONDS" -ge "${{ env.MAX_WAIT_SECONDS }}" ]; then
              echo "❌ Timeout waiting for build number"
              exit 1
            fi
            sleep 2
          done
          echo "🔢 Jenkins build number: $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

          echo "⏳ Waiting for build $BUILD_NUMBER to finish..."
          SECONDS=0
          while true; do
            STATUS=$(curl -s -u subbaramaiah_chevuru:1114faabfbe5e4af3e084d1710f9c1b5e0 \
              "http://192.168.241.134:8081/job/${{ env.JENKINS_JOB_NAME }}/$BUILD_NUMBER/api/json" \
              | jq -r '.result')
            if [ "$STATUS" != "null" ]; then
              echo "✅ Build finished with status: $STATUS"
              if [ "$STATUS" != "SUCCESS" ]; then
                echo "❌ Jenkins build failed"
                exit 1
              fi
              break
            fi
            if [ "$SECONDS" -ge "${{ env.MAX_WAIT_SECONDS }}" ]; then
              echo "❌ Timeout waiting for build completion"
              exit 1
            fi
            echo "Build is still running..."
            sleep 5
          done

      # 4️⃣ Determine version
      - name: Determine Version
        run: |
          set -euo pipefail

          PATCH=$((BUILD_NUMBER % 10))
          MINOR=$(((BUILD_NUMBER / 10) % 6))
          MAJOR=$((BUILD_NUMBER / 60))

          VERSION="v${MAJOR}.${MINOR}.${PATCH}"

          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "📦 Determined version: $VERSION"

      # 5️⃣ Append version to JSON (preserve ngrok_url)
      - name: Append version to JSON
        run: |
          set -euo pipefail

          mkdir -p .github/pages

          # If file exists, read it; else start with empty array
          if [ -f "${JSON_PATH}" ]; then
            EXISTING_JSON=$(cat "${JSON_PATH}")
          else
            EXISTING_JSON="[]"
          fi

          # Preserve ngrok_url from the latest entry if exists
          EXISTING_URL=$(echo "$EXISTING_JSON" | jq -r '.[-1].ngrok_url // ""')

          # Create new entry
          NEW_ENTRY=$(jq -n \
            --arg version "$VERSION" \
            --arg ngrok_url "$EXISTING_URL" \
            --arg last_updated "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            '{version: $version, ngrok_url: $ngrok_url, last_updated: $last_updated}')

          # Append new entry to existing array
          echo "$EXISTING_JSON" | jq ". + [${NEW_ENTRY}]" > "${JSON_PATH}"

          echo "📝 JSON updated (new version appended)"

      # 6️⃣ Commit JSON back to GitHub
      - name: Commit JSON
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "${JSON_PATH}"

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
          else
            git commit -m "Append version ${VERSION} [skip ci]"
            git push
            echo "✅ JSON committed"
          fi
